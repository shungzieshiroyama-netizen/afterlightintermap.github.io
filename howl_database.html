<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotchkiss Chronoshii Character Roster</title>
<style>
  :root{
    --bg:#0a0d13;
    --panel:#141922;
    --panel2:#1a2029;
    --line:rgba(150,170,200,.15);
    --line2:rgba(150,170,200,.3);
    --txt:#e2e8f0;
    --body:#b5c0cd;
    --dim:#7f8c9c;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,"JetBrains Mono","Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    /* theme accents (overridden per operative) */
    --acc:#e8a33d;
    --acc2:#5cc6ff;
    --acc-soft:rgba(232,163,61,.13);
    --glow:rgba(92,198,255,.2);
    --danger:#ef6a5e;
    --ok:#3fbf7f;
  }
  [data-theme="kate"]{
    --acc:#e8a33d; --acc2:#5cc6ff;
    --acc-soft:rgba(232,163,61,.13);
    --glow:rgba(92,198,255,.2);
  }
  [data-theme="shuzika"]{
    --acc:#e02b3c; --acc2:#ff5a5a;
    --acc-soft:rgba(224,43,60,.14);
    --glow:rgba(224,43,60,.26);
    --panel:#181015; --panel2:#1f151a;
    --line:rgba(210,150,160,.15);
    --line2:rgba(210,150,160,.3);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--txt);
    font-family:var(--sans);font-size:15px;line-height:1.7;
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }

  /* ══════ APP SHELL ══════ */
  .app{display:flex;height:100vh;width:100%;}

  /* ── SIDEBAR ── */
  .side{
    flex:0 0 268px;width:268px;height:100%;
    background:linear-gradient(180deg,#0e1219,#0b0e14);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden;z-index:20;
    transition:transform .28s ease;
  }
  .side .brand{
    padding:20px 20px 16px;border-bottom:1px solid var(--line);
  }
  .side .brand .t{
    font-size:14.5px;font-weight:800;letter-spacing:.045em;text-transform:uppercase;
    display:flex;align-items:center;gap:9px;line-height:1.25;
    word-break:break-word;
  }
  .side .brand .t i{
    width:9px;height:9px;border-radius:50%;background:var(--acc);
    box-shadow:0 0 10px var(--acc);animation:pulse 2.5s ease-in-out infinite;flex:0 0 auto;
    transition:background .4s,box-shadow .4s;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .side .brand .s{
    font-family:var(--mono);font-size:9px;letter-spacing:.24em;
    color:var(--dim);text-transform:uppercase;margin-top:5px;
  }
  .side .lbl{
    font-family:var(--mono);font-size:9px;letter-spacing:.24em;color:var(--dim);
    text-transform:uppercase;padding:16px 20px 8px;
  }
  .roster{flex:1;overflow-y:auto;padding:0 12px 16px;}
  .roster::-webkit-scrollbar{width:6px;}
  .roster::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px;}

  .op{
    display:flex;gap:11px;align-items:center;width:100%;text-align:left;
    padding:10px;margin-bottom:7px;border-radius:9px;cursor:pointer;
    background:rgba(255,255,255,.02);border:1px solid transparent;
    color:inherit;font:inherit;transition:.18s;position:relative;
  }
  .op:hover{background:rgba(255,255,255,.05);border-color:var(--line);}
  .op.active{background:var(--acc-soft);border-color:var(--acc);}
  .op.active::before{
    content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);
    width:3px;height:64%;background:var(--acc);border-radius:0 2px 2px 0;
  }
  .op .av{
    flex:0 0 42px;width:42px;height:42px;border-radius:7px;overflow:hidden;
    border:1px solid var(--line2);background:#0c1017;
  }
  .op .av img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block;}
  .op .meta{min-width:0;flex:1;}
  .op .nm{display:block;font-size:13.5px;font-weight:700;letter-spacing:-.1px;line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .op .fx{
    display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .op .st{
    flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--ok);
    box-shadow:0 0 7px rgba(63,191,127,.7);
  }
  .op .st.unk{background:#8b95a3;box-shadow:none;}

  .side .foot{
    padding:12px 20px;border-top:1px solid var(--line);
    font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;
    color:var(--dim);text-transform:uppercase;
  }

  /* mobile sidebar toggle */
  .burger{
    display:none;position:fixed;top:14px;left:14px;z-index:60;
    width:42px;height:42px;border-radius:9px;cursor:pointer;
    background:rgba(15,19,26,.94);border:1px solid var(--line2);color:var(--txt);
    font-size:17px;line-height:1;
  }

  /* ── MAIN ── */
  .main{
    flex:1;height:100%;overflow-y:auto;position:relative;
    background:
      radial-gradient(1000px 620px at 84% -6%, var(--glow), transparent 62%),
      radial-gradient(820px 520px at 6% 3%, var(--acc-soft), transparent 58%),
      linear-gradient(180deg,#0d1118 0%,#0a0d13 60%,#080a0f 100%);
  }
  .main::before{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(rgba(150,170,200,.04) 1px,transparent 1px),
      linear-gradient(90deg,rgba(150,170,200,.04) 1px,transparent 1px);
    background-size:70px 70px;
    mask-image:radial-gradient(ellipse 92% 60% at 50% 16%,#000 26%,transparent 100%);
    -webkit-mask-image:radial-gradient(ellipse 92% 60% at 50% 16%,#000 26%,transparent 100%);
  }
  .main::-webkit-scrollbar{width:9px;}
  .main::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px;}
  .inner{max-width:1080px;margin:0 auto;padding:28px 26px 70px;position:relative;z-index:1;}

  /* ══════ HOME ══════ */
  .home{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:50px 26px;position:relative;z-index:1;
  }
  .home h1{
    margin:0;font-size:clamp(24px,4.4vw,44px);font-weight:800;letter-spacing:.03em;
    text-transform:uppercase;line-height:1.14;max-width:22ch;
  }
  .home h1 .h2line{color:var(--acc);letter-spacing:.16em;}
  .home .sub{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.34em;color:var(--dim);
    text-transform:uppercase;margin-top:14px;
  }
  .home .rule{width:min(420px,80%);height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent);margin:26px 0;}
  .home .hint{color:var(--dim);font-size:14px;max-width:46ch;margin:0 0 30px;}
  .picks{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
  .pick{
    width:210px;border-radius:12px;overflow:hidden;cursor:pointer;text-align:left;
    background:var(--panel);border:1px solid var(--line);color:inherit;font:inherit;
    transition:.2s;padding:0;
  }
  .pick:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 14px 30px rgba(0,0,0,.45);}
  .pick .ph{display:block;height:150px;overflow:hidden;background:#0c1017;position:relative;}
  .pick .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 16%;display:block;}
  .pick .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,var(--panel));}
  .pick .bd{display:block;padding:12px 14px 14px;}
  .pick .bd .n{display:block;font-size:15px;font-weight:750;line-height:1.2;}
  .pick .bd .f{
    display:block;font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;
    color:var(--dim);margin-top:4px;
  }

  /* ══════ FACTION LOADER ══════ */
  .loader{
    position:fixed;inset:0;z-index:100;display:none;
    align-items:center;justify-content:center;flex-direction:column;gap:0;
    background:#05070a;
  }
  .loader.on{display:flex;}
  .loader.out{animation:fadeout .42s ease forwards;}
  @keyframes fadeout{to{opacity:0;visibility:hidden}}
  .loader .sheen{
    position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(circle at 50% 45%,var(--glow),transparent 58%);
  }
  .loader .scan{
    position:absolute;inset:0;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(180deg,transparent 0 3px,rgba(0,0,0,.4) 3px 4px);
  }
  .lmark{
    position:relative;display:flex;align-items:center;justify-content:center;
    width:230px;height:230px;margin-bottom:34px;
    animation:markin .8s cubic-bezier(.2,1,.3,1) both;
  }
  .lmark img{object-fit:contain;}
  @keyframes markin{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
  .lmark img{max-width:100%;max-height:100%;display:block;
    filter:drop-shadow(0 0 26px var(--glow));}
  .lmark svg{width:100%;height:100%;filter:drop-shadow(0 0 26px var(--glow));}
  .lmark .ring{
    position:absolute;inset:-14px;border:1px solid var(--line2);border-radius:50%;
    border-top-color:var(--acc);animation:spin 1.5s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* redacted / classified overlay on the faction mark */
  .lmark.censored img{filter:drop-shadow(0 0 26px var(--glow)) grayscale(.65) contrast(.85);opacity:.55;}
  .lmark .censorbar{
    position:absolute;left:-6%;right:-6%;top:44%;height:15%;
    background:#000;border:1px solid rgba(255,255,255,.14);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--acc);
    text-transform:uppercase;font-weight:700;transform:rotate(-3deg);
  }
  .lmark .noise{
    position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.5;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.09) 0 2px,transparent 2px 5px);
    animation:jitter .18s steps(2) infinite;
  }
  @keyframes jitter{50%{transform:translateY(-2px)}}

  .lname{
    font-family:var(--mono);font-size:14px;letter-spacing:.4em;text-transform:uppercase;
    color:var(--txt);font-weight:700;text-align:center;
    animation:markin .8s .12s cubic-bezier(.2,1,.3,1) both;
  }
  .lsub{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;
    color:var(--dim);margin-top:9px;text-align:center;
    animation:markin .8s .2s cubic-bezier(.2,1,.3,1) both;
  }
  .lbar{
    width:min(330px,64vw);height:2px;background:rgba(255,255,255,.1);
    margin-top:30px;overflow:hidden;border-radius:2px;
  }
  .lbar i{
    display:block;height:100%;width:0;background:var(--acc);
    box-shadow:0 0 12px var(--acc);animation:fill 1.5s cubic-bezier(.5,.05,.2,1) forwards;
  }
  @keyframes fill{to{width:100%}}
  .lstat{
    font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--dim);margin-top:12px;min-height:14px;
  }

  /* ══════ PROFILE ══════ */
  .fadein{animation:fin .5s ease both;}
  @keyframes fin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .topbar{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    font-family:var(--mono);font-size:10px;letter-spacing:.16em;
    color:var(--dim);text-transform:uppercase;
    padding-bottom:12px;margin-bottom:18px;border-bottom:1px solid var(--line);
  }
  .topbar .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);
    box-shadow:0 0 10px var(--acc);animation:pulse 2.5s ease-in-out infinite;}
  .topbar .sep{color:var(--line2);}
  .topbar .right{margin-left:auto;display:flex;gap:12px;flex-wrap:wrap;}
  .topbar b{color:var(--txt);font-weight:600;}
  .topbar .alive{color:var(--ok);}
  .topbar .unk{color:#a9b3c1;}

  header.hero{
    position:relative;border:1px solid var(--line);border-radius:14px;
    background:linear-gradient(120deg,var(--panel) 0%,var(--panel2) 52%,var(--panel) 100%);
    padding:28px 30px 0;overflow:hidden;margin-bottom:18px;
  }
  header.hero::before{
    content:"";position:absolute;top:0;left:0;width:3px;height:100%;
    background:linear-gradient(180deg,var(--acc),var(--acc2) 62%,transparent);
  }
  header.hero::after{
    content:"";position:absolute;right:-90px;top:-80px;width:440px;height:440px;border-radius:50%;
    background:radial-gradient(circle,var(--glow),transparent 66%);pointer-events:none;
  }
  .hero-in{display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap;}
  .hero-tx{flex:1 1 360px;min-width:280px;padding-bottom:28px;}
  .codename{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.3em;color:var(--acc);
    text-transform:uppercase;margin-bottom:9px;
  }
  h1.nm{margin:0;font-size:clamp(26px,4.2vw,40px);line-height:1.08;font-weight:780;letter-spacing:-.5px;}
  h1.nm .al{display:block;font-size:.5em;font-weight:600;color:var(--acc2);margin-top:7px;}
  .tagline{
    margin:15px 0 0;color:var(--dim);max-width:52ch;font-size:14.5px;
    border-left:2px solid var(--line2);padding-left:14px;
  }
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px;}
  .chip{
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    padding:5px 11px;border-radius:100px;border:1px solid var(--line2);
    color:var(--dim);background:rgba(255,255,255,.02);
  }
  .chip.acc{color:var(--acc);border-color:var(--acc);background:var(--acc-soft);}
  .chip.acc2{color:var(--acc2);border-color:var(--acc2);background:rgba(255,255,255,.03);}
  .chip.ok{color:var(--ok);border-color:rgba(63,191,127,.4);background:rgba(63,191,127,.1);}
  .chip.dg{color:var(--danger);border-color:rgba(239,106,94,.4);background:rgba(239,106,94,.1);}

  .hero-fig{position:relative;flex:0 0 300px;width:300px;align-self:flex-end;margin:0 0 -1px;}
  .hero-fig img{display:block;width:100%;height:auto;filter:drop-shadow(0 20px 34px rgba(0,0,0,.66));}
  .hero-fig .gl{
    position:absolute;left:50%;bottom:5%;transform:translateX(-50%);
    width:76%;height:58%;border-radius:50%;z-index:-1;
    background:radial-gradient(ellipse,var(--glow),transparent 68%);filter:blur(24px);
  }

  .vitals{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));
    gap:1px;background:var(--line);border:1px solid var(--line);
    border-radius:11px;overflow:hidden;margin-bottom:18px;
  }
  .vital{background:var(--panel);padding:14px 18px;transition:background .2s;}
  .vital:hover{background:var(--panel2);}
  .vital .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--dim);
    text-transform:uppercase;margin-bottom:5px;}
  .vital .v{font-size:15.5px;font-weight:650;letter-spacing:-.2px;line-height:1.3;}
  .vital .v small{font-size:11.5px;color:var(--dim);font-weight:500;}

  .cols{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;align-items:start;}
  .stack{display:flex;flex-direction:column;gap:18px;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:21px 24px;}
  .card h2{
    margin:0 0 15px;font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--acc);font-weight:600;
    display:flex;align-items:center;gap:9px;
  }
  .card h2::before{content:"";width:5px;height:5px;background:var(--acc);transform:rotate(45deg);flex:0 0 auto;}
  .card h2 .n{margin-left:auto;color:var(--dim);font-size:9.5px;letter-spacing:.14em;opacity:.7;}
  .card p{margin:0 0 12px;color:var(--body);}
  .card p:last-child{margin-bottom:0;}
  .card strong{color:#fff;font-weight:650;}
  .beat{
    color:var(--txt);font-weight:600;font-size:15.5px;padding-left:14px;
    border-left:2px solid var(--acc);margin:0 0 12px;
  }

  .fields{display:flex;flex-direction:column;}
  .field{display:grid;grid-template-columns:158px 1fr;gap:13px;align-items:baseline;
    padding:9px 0;border-bottom:1px dashed var(--line);}
  .field:first-child{padding-top:0;}
  .field:last-child{border-bottom:0;padding-bottom:0;}
  .field .k{font-family:var(--mono);font-size:10px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--dim);}
  .field .v{font-size:14.5px;color:var(--txt);font-weight:550;}
  @media (max-width:520px){.field{grid-template-columns:1fr;gap:2px;}}

  .stat{margin-bottom:12px;}
  .stat:last-child{margin-bottom:0;}
  .stat .row{display:flex;justify-content:space-between;align-items:baseline;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
  .stat .row span:first-child{color:#aeb9c5;}
  .stat .row span:last-child{color:var(--acc);font-weight:600;}
  .bar{height:5px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden;}
  .bar i{display:block;height:100%;border-radius:3px;transform-origin:left;
    background:linear-gradient(90deg,var(--acc2),var(--acc));
    animation:grow 1.1s cubic-bezier(.22,1,.36,1) forwards;}
  .bar i.warn{background:linear-gradient(90deg,#9a5cff,var(--danger));}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

  .tags{display:flex;flex-wrap:wrap;gap:7px;}
  .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:6px 11px;
    border-radius:5px;background:rgba(255,255,255,.04);border:1px solid var(--line2);
    color:var(--body);transition:.18s;}
  .tag:hover{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);}

  .traits{display:flex;flex-direction:column;}
  .trait{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:baseline;
    padding:10px 0;border-bottom:1px dashed var(--line);}
  .trait:first-child{padding-top:0;}
  .trait:last-child{border-bottom:0;padding-bottom:0;}
  .trait .name{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--acc);font-weight:600;white-space:nowrap;}
  .trait .name.alert{color:var(--danger);}
  .trait .desc{color:#aab7c9;font-size:14px;}

  .note{border-left:3px solid var(--danger);background:rgba(239,106,94,.07);
    border-radius:0 7px 7px 0;padding:13px 17px;font-size:14px;color:#e9c6c2;}
  .note .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--danger);font-weight:700;display:block;margin-bottom:5px;}
  .note.acc{border-left-color:var(--acc);background:var(--acc-soft);color:#e6d5c4;}
  .note.acc .lbl{color:var(--acc);}

  .ammo{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;}
  .rounds{display:flex;gap:4px;}
  .rounds i{width:7px;height:19px;border-radius:2px;display:block;
    background:linear-gradient(180deg,var(--acc),#7a5418);box-shadow:0 0 7px var(--acc-soft);}
  .rounds i.spent{background:rgba(255,255,255,.09);box-shadow:none;}
  .ammo .cap{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;
    text-transform:uppercase;color:var(--dim);}

  .interview{
    background:linear-gradient(135deg,var(--acc-soft),rgba(255,255,255,.02));
    border:1px solid var(--line2);border-radius:11px;padding:24px 28px;
  }
  .interview .q{font-size:clamp(15px,2vw,18.5px);line-height:1.55;font-weight:600;color:#f2e9dc;margin:0;}
  .interview .q::before{content:"“";color:var(--acc);}
  .interview .q::after{content:"”";color:var(--acc);}
  .interview .dir{margin:13px 0;color:var(--dim);font-size:13.5px;font-style:italic;
    padding-left:15px;border-left:1px solid var(--line2);}
  .interview .by{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--dim);margin-top:16px;padding-top:13px;border-top:1px solid var(--line);}

  .idphoto{position:relative;border-radius:9px;overflow:hidden;border:1px solid var(--line2);
    background:#0c1017;margin-bottom:14px;}
  .idphoto img{display:block;width:100%;height:auto;}
  .idphoto .scan{position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(180deg,transparent 0 3px,rgba(0,0,0,.16) 3px 4px);}
  .idphoto .cn{position:absolute;width:13px;height:13px;border:2px solid var(--acc);opacity:.75;}
  .idphoto .c1{top:7px;left:7px;border-right:0;border-bottom:0;}
  .idphoto .c2{top:7px;right:7px;border-left:0;border-bottom:0;}
  .idphoto .c3{bottom:7px;left:7px;border-right:0;border-top:0;}
  .idphoto .c4{bottom:7px;right:7px;border-left:0;border-top:0;}

  .swatches{display:flex;gap:6px;margin-top:4px;}
  .sw{width:22px;height:22px;border-radius:4px;border:1px solid rgba(255,255,255,.14);}

  /* ══════ REDACTION ══════ */
  .rd{
    position:relative;display:inline;background:#000;color:transparent;
    border-radius:2px;padding:0 3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
    user-select:none;text-shadow:none;
    transition:background .5s,color .5s,box-shadow .5s;
  }
  .unlocked .rd{
    background:rgba(224,43,60,.16);color:var(--txt);
    box-shadow:inset 0 0 0 1px rgba(224,43,60,.4);user-select:auto;font-weight:600;
  }

  .sealed{position:relative;overflow:hidden;}
  .sealed .veil{
    position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:9px;text-align:center;padding:22px;
    background:
      repeating-linear-gradient(135deg,rgba(0,0,0,.9) 0 12px,rgba(20,8,12,.9) 12px 24px);
    backdrop-filter:blur(3px);
  }
  .sealed .veil .ic{
    width:34px;height:34px;border:2px solid var(--acc);border-radius:7px;
    display:flex;align-items:center;justify-content:center;color:var(--acc);font-size:16px;
  }
  .sealed .veil .t{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--acc);font-weight:700;
  }
  .sealed .veil .s{
    font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  }
  .sealed .cipher{
    font-family:var(--mono);font-size:12px;line-height:1.9;color:rgba(224,43,60,.3);
    word-break:break-all;user-select:none;filter:blur(.6px);min-height:120px;
  }
  .sealed.open .veil{display:none;}
  .sealed.open .cipher{display:none;}
  .sealed .real{display:none;}
  .sealed.open .real{display:block;animation:fin .55s ease both;}

  /* access panel */
  .access{
    background:linear-gradient(135deg,rgba(224,43,60,.1),rgba(255,255,255,.02));
    border:1px solid rgba(224,43,60,.35);border-radius:11px;padding:20px 22px;
  }
  .access h2{margin:0 0 6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--acc);font-weight:700;}
  .access p{margin:0 0 14px;color:var(--dim);font-size:13.5px;}
  .access .form{display:flex;gap:8px;flex-wrap:wrap;}
  .access input{
    flex:1 1 150px;min-width:0;background:rgba(0,0,0,.5);border:1px solid var(--line2);
    border-radius:7px;padding:10px 13px;color:var(--txt);font-family:var(--mono);
    font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;outline:none;transition:.18s;
  }
  .access input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft);}
  .access button{
    flex:0 0 auto;background:var(--acc);color:#150409;border:0;border-radius:7px;
    padding:10px 18px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;font-weight:800;cursor:pointer;transition:.18s;
  }
  .access button:hover{filter:brightness(1.14);}
  .access .msg{
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    margin-top:11px;min-height:14px;color:var(--dim);
  }
  .access .msg.bad{color:var(--danger);}
  .access .msg.good{color:var(--ok);}
  .access.shake{animation:shk .4s;}
  @keyframes shk{
    10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)}
    30%,50%,70%{transform:translateX(-7px)} 40%,60%{transform:translateX(7px)}
  }
  .access .lockstate{
    display:flex;align-items:center;gap:8px;margin-bottom:12px;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
  }
  .access .lockstate .pill{
    padding:3px 9px;border-radius:3px;font-weight:700;
    background:rgba(239,106,94,.14);color:var(--danger);border:1px solid rgba(239,106,94,.4);
  }
  .unlocked .access .lockstate .pill{
    background:rgba(63,191,127,.14);color:var(--ok);border-color:rgba(63,191,127,.4);
  }

  footer{
    margin-top:24px;padding-top:16px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--dim);
  }
  footer .hl{color:var(--acc2);}

  @media (max-width:980px){ .cols{grid-template-columns:1fr;} }
  @media (max-width:860px){
    .burger{display:block;}
    .side{position:fixed;left:0;top:0;transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.6);}
    .side.open{transform:none;}
    .inner{padding:66px 18px 60px;}
    header.hero{padding:24px 20px 0;}
    .hero-in{flex-direction:column-reverse;align-items:center;}
    .hero-fig{flex:0 0 auto;width:min(80%,270px);}
    .hero-tx{padding-bottom:6px;}
  }
</style>
</head>

function cipher(len){
  const cs = "▓▒░ABCDEF0123456789#$%&@*+=/\\|<>()[]{}";
  let o = "";
  for (let i=0;i<len;i++) o += (i && i%67===0) ? "\n" : cs[Math.floor(Math.random()*cs.length)];
  return o;
}

  <div class="cols">
    <div class="stack">
      <section class="card">
        <h2>Before <span class="n">Log 01</span></h2>
        <p>Chronoshii Kate "Gorebunny" Ruzinaki was once an ordinary college student. Four years ago,
          her greatest concerns were lectures, assignments, examinations, and whatever mundane problems
          occupied the mind of a young woman who still believed there would be a tomorrow.</p>
        <p class="beat">Then the world began to scream.</p>
        <p>Kate was among the scattered few who survived the <strong>Howling Plague</strong>, though the
          person who entered the apocalypse was not quite the same person who remained four years later.
          The collapse of civilisation forced her to abandon university, her home, and nearly every
          ordinary expectation she once had for her future. What began as an unwilling struggle for
          survival gradually became a way of life.</p>
        <p>Despite everything she has endured, Kate remains remarkably cheerful. She is quirky, playful,
          and almost absurdly energetic. She smiles constantly, cracks jokes when she probably shouldn't,
          and possesses an almost irritating ability to find amusement in otherwise miserable
          circumstances. A ruined supermarket can become an exciting scavenging expedition. An abandoned
          military checkpoint becomes a treasure trove of equipment.</p>
        <p>Her old classmates might have recognised the same girl beneath all of it.</p>
        <p class="beat">Just considerably more armed.</p>
      </section>

      <section class="card">
        <h2>Marksmanship &amp; Ammunition Discipline <span class="n">Log 02</span></h2>
        <p>Kate developed a fascination with firearms before the collapse, but the apocalypse transformed
          that interest into genuine expertise. Four years of necessity taught her how to maintain weapons,
          conserve ammunition, judge distances, identify useful equipment, and most importantly,
          <strong>shoot without wasting a round</strong>.</p>
        <p>She understands that ammunition cannot simply be replaced anymore. Every cartridge represents
          something that may not be available again.</p>
        <div class="ammo">
          <span class="rounds"><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            <i class="spent"></i><i class="spent"></i><i class="spent"></i></span>
          <span class="cap">Discipline · every round accounted for</span>
        </div>
      </section>

      <section class="card">
        <h2>Engagement Doctrine — Howlers <span class="n">Log 03</span></h2>
        <p>As a <strong>Marksman</strong>, Kate prefers to keep her distance from Howlers. She is an
          excellent observer and can spend considerable time watching a location before deciding whether
          it is safe. She studies Howler movement, listens for their calls, identifies pack behaviour,
          and uses terrain to her advantage.</p>
        <p>Yet Kate's greatest advantage may be that she doesn't behave like someone who is afraid of them.</p>
        <p class="beat">She behaves like someone who has spent four years learning them.</p>
        <div class="note"><span class="lbl">⚠ Threat Note — Howlers</span>
          Still terrifying creatures. Their speed, pack behaviour, and predatory instincts make close
          encounters extraordinarily dangerous. Kate knows this better than most. She has seen what happens
          when someone panics, wastes ammunition, or allows themselves to become surrounded.</div>
        <p style="margin-top:14px">Consequently, when combat begins, her playful demeanour can vanish
          beneath something considerably colder.</p>
        <p class="beat">The grin remains.</p>
        <p class="beat">Her hands simply stop shaking.</p>
        <p style="margin-top:13px">Kate is <strong>brutal when fighting Howlers</strong>. She does not
          romanticise killing them, nor does she particularly enjoy the suffering involved. To her, a
          Howler is a former human being whose mind and body have been catastrophically altered. That
          knowledge makes killing them uncomfortable, but survival leaves little room for sentimentality
          when a pack is closing in.</p>
        <p>She aims to end encounters quickly. Kate is also willing to abandon conventional ideas of
          honour when necessary. She will retreat, hide, misdirect a pack, exploit terrain, or simply wait
          for a better opportunity. She has no interest in dying heroically.</p>
        <p class="beat">The world already has enough graves.</p>
      </section>

      <section class="card">
        <h2>Fieldcraft &amp; Virtus Outpost <span class="n">Log 04</span></h2>
        <p>Her survival skills extend beyond marksmanship. Kate has learned to <strong>scavenge abandoned
          buildings, identify edible plants, preserve food, ration supplies, navigate without reliable
          infrastructure, establish temporary shelters, and recognise signs of nearby Howler
          activity</strong>. She is particularly careful with resources because she remembers a time when
          wasting something was merely inconvenient.</p>
        <p class="beat">Now, wasting something can get someone killed.</p>
        <p>The camp known as <strong>Virtus Outpost</strong> has become one of the few places Kate considers
          home. It lacks reliable electricity, relying on stockpiled fuel and batteries, and food has
          become increasingly scarce. Kate contributes primarily through reconnaissance, scavenging,
          hunting, and protecting the camp from Howler packs.</p>
        <p>She is particularly fond of wandering farther from camp than anyone would prefer.
          Not because she is reckless.</p>
        <p class="beat">At least, that is what she insists.</p>
      </section>

      <section class="card">
        <h2>What Remains <span class="n">Log 05</span></h2>
        <p>Kate's greatest contradiction is that she still possesses the personality of the girl she used
          to be. She laughs. She teases. She gets excited over little things. She occasionally talks about
          university as though she might return to it someday.</p>
        <p>She knows she probably won't. Still, she refuses to let the apocalypse take
          <strong>everything</strong> from her.</p>
        <p>The world may have ended.</p>
        <p class="beat">Kate simply decided that she hadn't.</p>
      </section>

  { id:"kate", name:"Chronoshii Kate Ruzinaki", alias:"Gorebunny",
    faction:"virtus", factionLabel:"Virtus Outpost", theme:"kate",
    avatar:IMG.kateId, status:"ok", render:kateHTML },
  { id:"shuzika", name:"The Crimson Herscherr", alias:"Identity Sealed",
    faction:"nexa_sealed", factionLabel:"Independent · Sealed", theme:"shuzika",
    avatar:IMG.shuId, status:"unk", render:shuHTML }
];

/* ═══════ APP ═══════ */
const $ = s => document.querySelector(s);
const main = $("#main"), roster = $("#roster"), picks = $("#picks");
const loader = $("#loader"), lmark = $("#lmark"), lname = $("#lname"),
      lsub = $("#lsub"), lstat = $("#lstat");
let current = null, unlocked = false, busy = false;

/* build roster + home picks */
OPS.forEach(op => {
  const b = document.createElement("button");
  b.className = "op"; b.dataset.id = op.id;
  b.innerHTML = `<span class="av"><img src="${op.avatar}" alt=""></span>
    <span class="meta"><span class="nm">${esc(op.name)}</span>
    <span class="fx">${esc(op.factionLabel)}</span></span>
    <span class="st ${op.status==='ok'?'':'unk'}"></span>`;
  b.addEventListener("click", () => select(op.id));
  roster.appendChild(b);

  const p = document.createElement("button");
  p.className = "pick";
  p.innerHTML = `<span class="ph"><img src="${op.avatar}" alt=""></span>
    <span class="bd"><span class="n">${esc(op.name)}</span>
    <span class="f">${esc(op.alias)} · ${esc(op.factionLabel)}</span></span>`;
  p.addEventListener("click", () => select(op.id));
  picks.appendChild(p);
});

function select(id){
  if (busy || current === id) { closeSide(); return; }
  const op = OPS.find(o => o.id === id);
  if (!op) return;
  busy = true;
  closeSide();
  runLoader(op, () => {
    current = id;
    unlocked = false;
    document.body.setAttribute("data-theme", op.theme);
    document.querySelectorAll(".op").forEach(el =>
      el.classList.toggle("active", el.dataset.id === id));
    main.innerHTML = `<div class="inner fadein">${op.render()}</div>`;
    main.scrollTop = 0;
    if (id === "shuzika") wireAccess();
    busy = false;
  });
}

/* ── faction loading screen ── */
function runLoader(op, done){
  const f = FACTIONS[op.faction];
  document.body.setAttribute("data-theme", op.theme);

  lmark.className = "lmark" + (f.censored ? " censored" : "");
  lmark.innerHTML = `<span class="ring"></span>` +
    (f.img ? `<img src="${f.img}" alt="">` : f.svg) +
    (f.censored ? `<span class="noise"></span><span class="censorbar">Redacted</span>` : ``);

  lname.textContent = f.name;
  lsub.textContent  = f.sub;
  lstat.textContent = f.steps[0];

  loader.classList.remove("out");
  loader.classList.add("on");

  const t1 = setTimeout(() => lstat.textContent = f.steps[1], 620);
  const t2 = setTimeout(() => lstat.textContent = f.steps[2], 1280);
  const t3 = setTimeout(() => {
    loader.classList.add("out");
    setTimeout(() => {
      loader.classList.remove("on","out");
      done();
    }, 400);
  }, 1650);
  [t1,t2,t3];
}

/* ── access code panel ── */
function wireAccess(){
  const box = $("#access"), input = $("#codein"),
        btn = $("#codego"), msg = $("#codemsg"), pill = $("#lockpill");
  if (!box) return;

  const attempt = () => {
    const v = (input.value || "").trim().toUpperCase();
    if (!v) return;
    if (ACCESS_CODES.includes(v)){
      msg.className = "msg good";
      msg.textContent = "Access granted — decrypting archive…";
      pill.textContent = "Unlocked";
      unlocked = true;
      decrypt();
      btn.textContent = "Unlocked";
      btn.disabled = true;
      input.value = "";
      input.disabled = true;
      input.placeholder = "ARCHIVE OPEN";
    } else {
      msg.className = "msg bad";
      msg.textContent = "Access denied — invalid code";
      box.classList.remove("shake");
      void box.offsetWidth;
      box.classList.add("shake");
    }
  };

  btn.addEventListener("click", attempt);
  input.addEventListener("keydown", e => { if (e.key === "Enter") attempt(); });
}

/* reveal sealed sections with a decode shimmer */
function decrypt(){
  const inner = main.querySelector(".inner");
  if (!inner) return;

  /* inline redactions ease in first */
  inner.classList.add("unlocked");

  /* then each sealed section decodes in sequence */
  const seals = [...main.querySelectorAll(".sealed")];
  seals.forEach((s, i) => {
    const veil = s.querySelector(".veil");
    setTimeout(() => {
      if (veil){
        veil.style.transition = "opacity .3s ease";
        veil.style.opacity = "0";
      }
      setTimeout(() => s.classList.add("open"), 260);
    }, 190 * i);
  });
}

/* ── mobile sidebar ── */
const side = $("#side");
$("#burger").addEventListener("click", () => side.classList.toggle("open"));
function closeSide(){ side.classList.remove("open"); }
main.addEventListener("click", () => { if (window.innerWidth <= 860) closeSide(); });
</script>
</body>
